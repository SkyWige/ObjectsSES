name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ObjectsSES.apk
          gh release create "build-${{ github.run_number }}" ObjectsSES.apk \
            --target "${{ github.sha }}" \
            --title "Сборка ${{ github.run_number }}" \
            --notes "Установочный файл для Android." \
            --latest
